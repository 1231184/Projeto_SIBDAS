<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MedStock</title>
    <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/fontawesome/all.min.css">
    <link rel="stylesheet" href="../assets/css/1231184.css">
</head>

<body
    class="bg-login d-flex flex-column align-items-center justify-content-center min-vh-100 position-relative overflow-hidden px-3">

    <div class="hero-bg-glow-1 position-absolute rounded-circle"></div>
    <div class="hero-bg-glow-2 position-absolute rounded-circle"></div>

    <div class="container position-relative z-index-1" style="max-width: 480px;">

        <div class="mb-4 text-center text-md-start">
            <a href="../public/index.html"
                class="text-decoration-none text-white-50 hover-text-white transition-all small">
                <i class="fa-solid fa-arrow-left me-2"></i>Voltar ao site
            </a>
        </div>

        <div class="text-center mb-4">
            <div class="d-flex align-items-center justify-content-center gap-3 mb-2">
                <div class="login-logo-box text-brand">
                    <i class="fa-solid fa-stethoscope"></i>
                </div>
                <h1 class="fw-bold mb-0 text-white" style="font-size: 3rem;">
                    MedStock
                </h1>
            </div>
            <p class="text-white-50 mb-0">Sistema de Gestão de Inventário Hospitalar</p>
        </div>

        <div class="card border-0 shadow-lg rounded-4"
            style="background-color: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px);">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <h4 class="fw-bold text-dark mb-1">Acesso Reservado</h4>
                    <p class="text-muted small mb-0">Introduza as suas credenciais para continuar</p>
                </div>

                <form action="../private/dashboard/dashboard.html" method="get">

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark small mb-1">Utilizador <span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg fs-6 rounded-3 bg-light border-light"
                            placeholder="admin" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-dark small mb-1">Palavra-passe <span
                                class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="password" id="passwordInput"
                                class="form-control form-control-lg fs-6 rounded-start-3 bg-light border-light border-end-0"
                                placeholder="••••••••" required>
                            <button type="button" id="togglePassword"
                                class="btn btn-light border-light border-start-0 text-muted rounded-end-3 px-3">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-grid mt-2 mb-4">
                        <button type="submit"
                            class="btn btn-brand btn-lg rounded-3 fw-semibold shadow-sm text-white fs-6 py-3">
                            Entrar <i class="fa-solid fa-right-to-bracket ms-2"></i>
                        </button>
                    </div>

                    <p class="text-center text-muted small mb-0" style="font-size: 0.8rem;">
                        Acesso restrito a pessoal autorizado
                    </p>

                </form>

            </div>
        </div>

        <div class="text-center mt-4">
            <p class="text-white-50 small mb-0" style="font-size: 0.8rem;">MedStock Solutions © 2026</p>
        </div>

    </div>

    <script src="../assets/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="fa-regular fa-eye"></i>' : '<i class="fa-regular fa-eye-slash"></i>';
        });
    </script>
</body>

</html>
